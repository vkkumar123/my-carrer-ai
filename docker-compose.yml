# Local development stack: docker compose up --build
# Needs ANTHROPIC_API_KEY and SARVAM_API_KEY in a root .env file (see .env.example).
# Host ports can be changed in .env (WEB_HOST_PORT, API_HOST_PORT, POSTGRES_HOST_PORT) if
# something else on your machine already uses them.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mycareer
      POSTGRES_PASSWORD: mycareer
      POSTGRES_DB: mycareer
    # Host port 5433 so it doesn't clash with a locally installed Postgres on 5432.
    # Containers still reach it at postgres:5432. Override with POSTGRES_HOST_PORT.
    ports: ["${POSTGRES_HOST_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycareer"]
      interval: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:latest
    # Advertise 127.0.0.1 for audio: your browser reaches it through the published ports
    # (the container's own IP isn't reachable from the host on Docker Desktop for Mac/Windows).
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]

  api:
    build: ./services/api
    env_file: [./services/api/.env.example]
    environment:
      DATABASE_URL: postgresql+psycopg://mycareer:mycareer@postgres:5432/mycareer
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LIVEKIT_URL: ws://localhost:7880
      CORS_ORIGINS: http://localhost:${WEB_HOST_PORT:-3000}
      SUPABASE_URL: ${SUPABASE_URL:-}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./services/api/app:/app/app", "./services/api/data:/app/data"]
    ports: ["${API_HOST_PORT:-8010}:8000"]
    depends_on:
      postgres: {condition: service_healthy}

  agent:
    build: ./services/agent
    env_file: [./services/agent/.env.example]
    # Shares LiveKit's network, so 127.0.0.1 (the address LiveKit advertises) works for the
    # interviewer as well. Other services are still reachable by name (api).
    network_mode: "service:livekit"
    environment:
      LIVEKIT_URL: ws://localhost:7880
      API_BASE_URL: http://api:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-sarvam}
    command: python -m interviewer.main dev
    depends_on: [livekit, api]

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      # The browser calls the API through the host port.
      NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-8010}
      # Google sign-in (optional locally; see docs/GOOGLE_SIGN_IN.md)
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    # node_modules and the copied browser runtimes live inside the container, not in your
    # project folder (faster, and avoids file-sharing permission issues on macOS).
    volumes: ["./apps/web:/app", "/app/node_modules", "/app/public/vendor"]
    ports: ["${WEB_HOST_PORT:-3000}:3000"]
    depends_on: [api]

volumes:
  pgdata:
