# Local development stack: docker compose up --build
# Needs ANTHROPIC_API_KEY and DEEPGRAM_API_KEY in a root .env file (see .env.example).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mycareer
      POSTGRES_PASSWORD: mycareer
      POSTGRES_DB: mycareer
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycareer"]
      interval: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]

  api:
    build: ./services/api
    env_file: [./services/api/.env.example]
    environment:
      DATABASE_URL: postgresql+psycopg://mycareer:mycareer@postgres:5432/mycareer
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LIVEKIT_URL: ws://localhost:7880
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./services/api/app:/app/app", "./services/api/data:/app/data"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}

  agent:
    build: ./services/agent
    env_file: [./services/agent/.env.example]
    environment:
      LIVEKIT_URL: ws://livekit:7880
      API_BASE_URL: http://api:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
    command: python -m interviewer.main dev
    depends_on: [livekit, api]

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes: ["./apps/web:/app", "/app/node_modules"]
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
