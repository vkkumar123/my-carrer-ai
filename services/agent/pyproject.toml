[project]
name = "mycareer-agent"
version = "0.1.0"
description = "My Career AI - realtime voice interviewer (LiveKit Agents)"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[deepgram,anthropic,silero]>=1.8.3,<2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
